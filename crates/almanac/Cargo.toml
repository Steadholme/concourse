[package]
name = "almanac"
version = "0.1.0"
edition = "2021"
description = "Almanac — server-rendered personal calendar + contacts for the HOLDFAST stack."
license = "MIT OR Apache-2.0"

[lib]
name = "almanac"
path = "src/lib.rs"

[[bin]]
name = "almanac"
path = "src/main.rs"

[dependencies]
# HTTP framework (shared with keystone/lattice/watchtower): Path/State/Query/Form extractors,
# typed Html/Redirect responses.
axum = "0.8"
# Async runtime axum runs on. The Store trait is async: handlers `.await` it directly and
# PgStore uses sqlx natively, so a worker thread is NEVER blocked (no sync-over-async bridge).
# `net`/`io-util`/`time` back the reminder delivery hook: a raw TCP HTTP/1.1 POST to Klaxon's
# internal ingest (mirroring the sibling producers — no HTTP-client dependency) plus the timed,
# bounded due-scan. Inert unless `ALMANAC_KLAXON_NOTIFY_URL` is configured.
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "net", "io-util", "time"] }
# Erase the async Store trait methods so `Arc<dyn Store>` stays object-safe (same seam as the
# rest of the estate).
async-trait = "0.1"
# Deserialize the urlencoded event/contact forms + the month + new-event query strings.
serde = { version = "1", features = ["derive"] }
# Ergonomic error/store enums -> HTML error responses.
thiserror = "2"
# Structured logging.
tracing = "0.1"
tracing-subscriber = "0.3"
# CSPRNG for CSRF tokens + event/contact ids (pure Rust, no OpenSSL — only glibc, like lattice).
getrandom = "0.2"
# Hex-encode the random bytes for the CSRF token / row ids.
hex = "0.4"
# HMAC-SHA256 verification of the gateway-injected identity signature (X-Auth-Sig). Shared
# primitive with the rest of the estate; the canonical message matches Sluice's Go signer.
hmac = "0.12"
sha2 = "0.10"
# Calendar math (month grid, weekday of the 1st, days-in-month) + epoch <-> UTC components for
# the datetime-local form inputs and human-readable labels. `std` only — no extra C deps.
time = { version = "0.3", default-features = false, features = ["std"] }
# Portable PostgreSQL data layer. Runtime queries only (sqlx::query/Row) — NO compile-time
# macros, so the build needs NO database. rustls TLS (no openssl). The same standard-SQL
# statements later run unchanged on FusionDB over pgwire.
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "postgres"] }

[dev-dependencies]
# ServiceExt::oneshot drives the Router in-process for the end-to-end tests (no port bind).
tower = { version = "0.5", features = ["util"] }
