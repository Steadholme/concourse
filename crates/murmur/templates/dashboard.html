<!DOCTYPE html>
<html lang="en"{{THEME}}>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="{{COLOR_SCHEME}}">
  <title>Murmur · HOLDFAST</title>
  <style>{{CSS}}</style>
</head>
<body class="page-chat">
{{TOPBAR}}
<main class="chat">
  <aside class="murmur-sidebar">
    <div class="murmur-sidebar__head">
      <h1 class="murmur-sidebar__title">Rooms</h1>
      <div class="murmur-sidebar__actions">
        <button id="new-dm" class="btn btn-secondary btn-sm" type="button">New DM</button>
        <button id="new-room" class="btn btn-secondary btn-sm" type="button">New</button>
      </div>
    </div>
    <form id="search-form" class="murmur-sidebar__search" autocomplete="off">
      <input id="search-input" class="input input-sm" type="search" placeholder="Search messages&hellip;" maxlength="200" aria-label="Search messages">
      <button id="mentions-btn" class="btn btn-ghost btn-sm" type="button" title="Your mentions" aria-label="Your mentions">@ Mentions</button>
    </form>
    <ul id="room-list" class="room-list">
      {{ROOMS}}
    </ul>
  </aside>
  <section class="room-view">
    <header class="room-view__head">
      <div class="room-view__heading">
        <h2 id="room-title" class="room-view__title">{{ROOM_TITLE}}</h2>
        <div id="room-topic" class="room-view__topic">{{TOPIC}}</div>
      </div>
      <div class="room-view__meta">
        <button id="topic-edit" class="btn btn-ghost btn-sm" type="button" hidden>Edit topic</button>
        <button id="pin-toggle" class="btn btn-ghost btn-sm" type="button" aria-expanded="false">Pinned</button>
        <span id="presence" class="room-view__presence"></span>
      </div>
    </header>
    <div id="pinned-panel" class="pinned-panel" hidden>
      <div class="pinned-panel__head">Pinned messages</div>
      <div id="pinned-list" class="pinned-panel__list">
        {{PINNED}}
      </div>
    </div>
    <div id="timeline" class="timeline">
      {{MESSAGES}}
    </div>
    <form id="composer" class="composer" autocomplete="off">
      <textarea id="composer-input" class="composer__input" rows="1" maxlength="8192"
        placeholder="Message {{ROOM_TITLE}}&hellip;"></textarea>
      <button class="btn btn-primary" type="submit">Send</button>
    </form>
  </section>
</main>
<script>
  window.MURMUR = {
    csrf: "{{CSRF}}",
    me: "{{ME}}",
    selected: "{{SELECTED}}",
    isMod: {{IS_MOD}}
  };
</script>
<script>{{JS}}</script>
</body>
</html>
