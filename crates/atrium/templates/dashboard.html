<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <meta name="csrf-token" content="{{CSRF}}">
  <title>Atrium · HOLDFAST</title>
  <style>{{CSS}}</style>
</head>
<body class="page-app">
{{TOPBAR}}
<main class="shell">
  <div class="shell__head">
    <div>
      <h1 class="shell__title">Activity inbox</h1>
      <p class="shell__sub">Everything new across the keep — chat, notifications, and your feeds in one pane.</p>
    </div>
  </div>

  {{SEARCH}}

  <div id="summary-slot">{{SUMMARY}}</div>

  <div class="columns" id="columns-slot">
    {{COLUMNS}}
  </div>

  <nav class="quicklinks" aria-label="Quick links">
    <span class="quicklinks__label">Jump to</span>
    <a class="quicklinks__link" href="https://mail.w33d.xyz">Mail</a>
    <a class="quicklinks__link" href="https://forum.w33d.xyz">Forum</a>
    <a class="quicklinks__link" href="https://wiki.w33d.xyz">Wiki</a>
    <a class="quicklinks__link" href="https://w33d.xyz">Home</a>
  </nav>

  <p class="atrium-foot">HOLDFAST · Sovereign infrastructure · one sign-on across every service</p>
</main>
<div class="toast-host" id="toast-host" aria-live="polite" aria-atomic="true"></div>
<script>
// Live auto-refresh: poll the aggregated inbox JSON (~20 s) and swap the freshly server-rendered
// summary + columns fragments into their slots WITHOUT a full page reload. Because only the inner
// HTML of the two slots is replaced, the window scroll position is preserved. Every fragment is
// server-escaped (identical to the initial render), so assigning innerHTML carries no new XSS risk.
// A transient network error is swallowed — the last good render simply stays on screen.
(function () {
  var INTERVAL_MS = 20000;
  function csrf() {
    var m = document.querySelector('meta[name="csrf-token"]');
    return m ? m.getAttribute('content') : '';
  }
  function apply(id, html) {
    if (typeof html !== 'string') return;
    var el = document.getElementById(id);
    if (el) el.innerHTML = html;
  }
  // Transient write feedback via the Odyssey v2 .toast kit (text set as textContent only).
  var toastHost = document.getElementById('toast-host');
  function toast(text, kind) {
    if (!toastHost) return;
    var el = document.createElement('div');
    el.className = 'toast ' + (kind === 'err' ? 'toast--err' : 'toast--ok');
    el.setAttribute('role', 'status');
    el.textContent = String(text);
    toastHost.appendChild(el);
    requestAnimationFrame(function () { el.classList.add('is-in'); });
    setTimeout(function () {
      el.classList.remove('is-in');
      setTimeout(function () { if (el.parentNode) el.parentNode.removeChild(el); }, 200);
    }, 2600);
  }
  async function refresh() {
    try {
      // Carry the current ?q= / ?source= so a live refresh preserves the active filter.
      var res = await fetch('/api/inbox' + window.location.search, {
        headers: { 'Accept': 'application/json' },
        credentials: 'same-origin',
        cache: 'no-store'
      });
      if (!res.ok) return;
      var data = await res.json();
      apply('summary-slot', data.summary);
      apply('columns-slot', data.columns);
    } catch (e) {
      /* transient error — keep the current view */
    }
  }
  // In-place row actions (mark-read / dismiss). Delegated so it keeps working after the columns
  // fragment is swapped by a poll. On success the row is removed immediately and a refresh
  // reconciles the counts; the double-submit CSRF token rides the X-CSRF-Token header.
  async function onActionClick(ev) {
    var btn = ev.target.closest('.row__act');
    if (!btn) return;
    var row = btn.closest('.row');
    if (!row) return;
    var action = btn.getAttribute('data-action'); // "read" | "dismiss"
    var source = row.getAttribute('data-source');
    var key = row.getAttribute('data-key');
    if (!source || !key) return;
    ev.preventDefault();
    // Disable the row's buttons while the request is in flight.
    row.querySelectorAll('.row__act').forEach(function (b) { b.disabled = true; });
    try {
      var res = await fetch('/api/inbox/' + action, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'X-CSRF-Token': csrf()
        },
        credentials: 'same-origin',
        cache: 'no-store',
        body: JSON.stringify({ source: source, key: key })
      });
      if (res.ok) {
        row.parentNode && row.parentNode.removeChild(row);
        toast(action === 'dismiss' ? 'Dismissed' : 'Marked read');
        refresh();
      } else {
        row.querySelectorAll('.row__act').forEach(function (b) { b.disabled = false; });
        toast("Couldn't update — try again", 'err');
      }
    } catch (e) {
      row.querySelectorAll('.row__act').forEach(function (b) { b.disabled = false; });
      toast("Couldn't update — check your connection", 'err');
    }
  }
  var cols = document.getElementById('columns-slot');
  if (cols) cols.addEventListener('click', onActionClick);
  setInterval(refresh, INTERVAL_MS);

  // --- Debounced live search ------------------------------------------------
  // Typing in the unified search box (or changing the source filter) fetches the same JSON
  // aggregate and swaps the summary + columns in place — no full reload. The GET <form> still
  // works with JS off; here we just enhance it. The shareable URL is kept in sync via replaceState
  // so the ~20 s live poll (which reads window.location.search) preserves the active query.
  var qInput = document.querySelector('.searchbar__q');
  var sourceSel = document.querySelector('.searchbar__source');
  var searchForm = document.querySelector('.searchbar');
  function liveQuery() {
    var params = new URLSearchParams();
    if (qInput && qInput.value.trim()) params.set('q', qInput.value.trim());
    if (sourceSel && sourceSel.value && sourceSel.value !== 'all') params.set('source', sourceSel.value);
    return params.toString();
  }
  function liveSearch() {
    var qs = liveQuery();
    fetch('/api/inbox' + (qs ? '?' + qs : ''), {
      headers: { 'Accept': 'application/json' },
      credentials: 'same-origin',
      cache: 'no-store'
    })
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (data) {
        if (!data) return;
        apply('summary-slot', data.summary);
        apply('columns-slot', data.columns);
        try { history.replaceState(null, '', qs ? ('/?' + qs) : '/'); } catch (e) {}
      })
      .catch(function () { /* keep the last good view */ });
  }
  var searchTimer;
  if (qInput) {
    qInput.addEventListener('input', function () {
      clearTimeout(searchTimer);
      searchTimer = setTimeout(liveSearch, 250);
    });
  }
  if (sourceSel) sourceSel.addEventListener('change', liveSearch);
  if (searchForm) {
    // Enter submits without a reload when JS is on (no-JS falls back to the plain GET).
    searchForm.addEventListener('submit', function (ev) { ev.preventDefault(); clearTimeout(searchTimer); liveSearch(); });
  }
})();
</script>
</body>
</html>
