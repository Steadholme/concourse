[package]
name = "atrium"
version = "0.1.0"
edition = "2021"
description = "Atrium — unified activity inbox (one pane over chat + notifications + feeds) for the Steadholme estate."
license = "MIT OR Apache-2.0"

[lib]
name = "atrium"
path = "src/lib.rs"

[[bin]]
name = "atrium"
path = "src/main.rs"

[dependencies]
# HTTP framework (shared with the rest of the estate): State extractors, typed responses.
axum = "0.8"
odyssey = { path = "../odyssey" }
# Async runtime axum runs on. The Source trait is async: the engine `.await`s each federated
# source directly and the Pg sources drive sqlx natively, so a worker thread is NEVER blocked
# (no block_in_place, no sync-over-async). `rt-multi-thread` keeps the serving runtime parallel
# and lets the three sections fetch CONCURRENTLY (tokio::join!) so one slow source can't
# serialize the page. `sync` backs the audit mpsc channel.
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync"] }
# Erase the async Source trait methods so `Arc<dyn Source>` stays object-safe (the engine + the
# tests depend only on the trait — an in-memory fake and a Pg source drop in interchangeably,
# exactly like the cortex federation seam).
async-trait = "0.1"
# Derive Serialize for the audit event payload.
serde = { version = "1", features = ["derive"] }
# Serialize the audit event JSON posted to Watchtower.
serde_json = "1"
# Ergonomic error enums -> branded HTML error page.
thiserror = "2"
# Structured logging (a down/skipped federated source warns, never errors the page).
tracing = "0.1"
tracing-subscriber = "0.3"
# Epoch -> UTC date components for the relative-time lines (std only — no C deps). Same crate
# the rest of the estate pins.
time = { version = "0.3", default-features = false, features = ["std"] }
# Portable PostgreSQL data layer, READ-ONLY against each federated source DB (Murmur / Klaxon /
# Current). Runtime queries only (sqlx::query/Row) — NO compile-time macros, so the build needs
# NO database. rustls TLS (no openssl). Standard SQL only, so the same statements later run
# unchanged on FusionDB over pgwire.
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "postgres"] }
# HMAC-SHA256 verification of the gateway-injected identity signature (X-Auth-Sig). Shared
# primitive with the rest of the estate; the canonical message matches Sluice's Go signer.
hmac = "0.12"
sha2 = "0.10"

[dev-dependencies]
# ServiceExt::oneshot drives the Router in-process for the end-to-end tests (no port bind).
tower = { version = "0.5", features = ["util"] }
