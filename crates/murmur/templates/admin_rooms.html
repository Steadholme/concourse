<!DOCTYPE html>
<html lang="en"{{THEME}}>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="{{COLOR_SCHEME}}">
  <title>Admin · Murmur · Steadholme</title>
  <style>{{CSS}}</style>
</head>
<body class="page-chat">
{{TOPBAR}}

<!--
  Murmur · Cutout Bay — room registry sheet (K3-owned template).

    {{ROOMS}}  <tr> rows. REQUIRED row shape:
                 <tr>
                   <td data-label="Room"><a class="cut-sheet__room" href="/admin/rooms/{id}">{name}</a>
                       <span class="mono cut-sheet__id">{id}</span></td>
                   <td data-label="Kind">{kind}</td>
                   <td data-label="Created by">{creator}</td>
                   <td data-label="Status"><span class="cut-sheet__state">Active|Archived|System room</span></td>
                   <td data-label="Actions"><div class="cut-sheet__actions">
                     <form method="post" action="/admin/rooms/{id}/archive">…csrf…
                       <button type="submit">Archive</button></form>
                     <a class="cut-link" href="/admin/rooms/{id}#cut-delete">Delete…</a>
                   </div></td>
                 </tr>
               Delete is a LINK to the detail page's consequence section (two-step, server
               verifies confirm=delete + csrf) — never an inline form, never onsubmit/confirm().
               #lobby rows render NO archive/delete control (the server refuses both; the panel
               must not offer consequences it would immediately reverse).
               Status is plain text — no pill badge.
-->

<main class="cutout">
  <section class="cutout__sheet" aria-labelledby="cutout-title">
    <header class="cutout__head">
      <h1 class="cutout__title" id="cutout-title">Cutout Bay</h1>
      <p class="cutout__sub">Room registry — moderator control overrides ownership. Destructive actions are cut-marked and verified again on the server.</p>
    </header>
    <table class="cut-sheet">
      <thead>
        <tr>
          <th scope="col">Room</th>
          <th scope="col">Kind</th>
          <th scope="col">Created by</th>
          <th scope="col">Status</th>
          <th scope="col" class="cut-sheet__col-actions">Actions</th>
        </tr>
      </thead>
      <tbody>
        {{ROOMS}}
      </tbody>
    </table>
  </section>
</main>

</body>
</html>
